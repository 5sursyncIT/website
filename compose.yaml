name: 5sursync
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: syncit
      POSTGRES_USER: syncit
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U syncit -d syncit"]
      interval: 10s
      timeout: 3s
      retries: 12
    mem_limit: 1g
    cpus: 1.0
    security_opt: [no-new-privileges:true]
  app:
    image: 5sursync:${RELEASE_TAG:-local}
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:3105:3000"]
    environment:
      APP_ORIGIN: https://preprod.5sursync.com
      ADMIN_ORIGIN: http://localhost:3105
      BOOTSTRAP_ADMIN_EMAIL: ydiop@5sursync.com
      # Preproduction is isolated from production (documentation/microsoft365.md, section 7):
      # own non-superuser database role, own Payload secret, own file volumes.
      DATABASE_URI_FILE: /run/secrets/database_uri_preprod
      PAYLOAD_SECRET_FILE: /run/secrets/payload_secret_preprod
      PRIVATE_UPLOAD_PATH: /app/storage/private
      MEDIA_STORAGE_PATH: /app/storage/media
    secrets: [database_uri_preprod, payload_secret_preprod]
    volumes:
      [private_files_preprod:/app/storage/private, public_media_preprod:/app/storage/media]
    networks: [database, egress]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 60s
    mem_limit: 2g
    cpus: 1.5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
networks:
  database: { internal: true }
  egress: {}
volumes:
  postgres_data: {}
  private_files: {}
  public_media: {}
  private_files_preprod: {}
  public_media_preprod: {}
secrets:
  db_password: { file: ./secrets/db_password }
  database_uri: { file: ./secrets/database_uri }
  payload_secret: { file: ./secrets/payload_secret }
  database_uri_preprod: { file: ./secrets/database_uri_preprod }
  payload_secret_preprod: { file: ./secrets/payload_secret_preprod }
