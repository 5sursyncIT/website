# Test-only IMAP server (tests/mail-imap-run.sh): internal Docker network, fixture password,
# certificates from a throwaway test authority. Folder names are deliberately unusual and
# decoys named "Drafts" / "Sent" carry no SPECIAL-USE attribute: the CRM must pick the
# folders by their attributes (RFC 6154), not by their names.
protocols = imap
listen = *
mail_home = /srv/mail/%Lu
mail_location = maildir:~/Maildir
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000
ssl = required
ssl_cert = </certs/imap.crt
ssl_key = </certs/imap.key
ssl_min_protocol = TLSv1.2
disable_plaintext_auth = yes
auth_mechanisms = plain login
passdb {
  driver = static
  args = password=fixture-imap-pass
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%Lu
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox "Brouillons perso" {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox "Messages envoyés" {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    auto = subscribe
  }
  mailbox Sent {
    auto = subscribe
  }
}
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
log_path = /dev/stdout
info_log_path = /dev/stdout
