# Production site behind the existing stream 443 relay (SNI -> 127.0.0.1:9444).
# Admin, CMS API and team pages: Nginx Basic Auth (user-created htpasswd) + Payload login.

server {
    listen 127.0.0.1:9444 ssl proxy_protocol;
    server_name 5sursync.com;
    ssl_certificate /etc/letsencrypt/live/5sursync.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/5sursync.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    client_max_body_size 6m;
    # Matched on the normalized URI: encoded or double-slash variants land here too.
    location ~ ^/(admin|api/cms|team|api/team)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        auth_basic "5/Sync IT administration";
        auth_basic_user_file /etc/nginx/5sursync-admin.htpasswd;
        limit_req zone=syncit_admin burst=60 nodelay;
        proxy_pass http://127.0.0.1:3106;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # The Basic Auth password never reaches the application.
        proxy_set_header Authorization "";
        proxy_set_header Connection '';
        proxy_read_timeout 60s;
    }
    # ERP vhost must serve Dolibarr at its root before enabling this redirect.
    location ~ ^/gestion(?:/(.*))?$ {
        return 308 https://gestion.5sursync.com/$1$is_args$args;
    }
    location ~ ^/(support|api)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:3106;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection '';
    }
    location / {
        proxy_pass http://127.0.0.1:3106;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection '';
        proxy_read_timeout 60s;
    }
}

server {
    listen 127.0.0.1:9444 ssl proxy_protocol;
    server_name www.5sursync.com;
    ssl_certificate /etc/letsencrypt/live/5sursync.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/5sursync.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://5sursync.com$request_uri;
}
