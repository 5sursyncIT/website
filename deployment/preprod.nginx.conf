# Preproduction site behind the existing stream 443 relay (SNI -> 127.0.0.1:9443).
# Admin, CMS API and team pages: Nginx Basic Auth (user-created htpasswd) + Payload login.
limit_req_zone $binary_remote_addr zone=syncit_admin:1m rate=5r/s;
server {
    listen 127.0.0.1:9443 ssl proxy_protocol;
    server_name preprod.5sursync.com;
    ssl_certificate /etc/letsencrypt/live/preprod.5sursync.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preprod.5sursync.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    client_max_body_size 6m;
    add_header X-Robots-Tag 'noindex, nofollow' always;
    # Matched on the normalized URI: encoded or double-slash variants land here too.
    location ~ ^/(admin|api/cms|team|api/team)(/|$) {
        auth_basic "5/Sync IT administration";
        auth_basic_user_file /etc/nginx/5sursync-admin.htpasswd;
        limit_req zone=syncit_admin burst=60 nodelay;
        proxy_pass http://127.0.0.1:3105;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # The Basic Auth password never reaches the application.
        proxy_set_header Authorization "";
        proxy_set_header Connection '';
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:3105;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection '';
        proxy_read_timeout 60s;
    }
}
